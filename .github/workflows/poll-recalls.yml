name: Poll recalls for new alerts

# Triggers the push poller on a schedule. GitHub's scheduler aims for the given
# cadence but can be delayed several minutes under load — fine for alerts that
# only need to land within a few minutes of the government publishing.
on:
  schedule:
    - cron: "*/5 * * * *" # every ~5 minutes (the poll is a cheap conditional
      # request — a 304 when nothing changed — so this is near-free)
  workflow_dispatch: {} # allow manual runs from the Actions tab

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - name: Hit the poll endpoint
        env:
          POLL_URL: ${{ secrets.POLL_URL }}
          POLL_SECRET: ${{ secrets.POLL_SECRET }}
        run: |
          if [ -z "$POLL_URL" ] || [ -z "$POLL_SECRET" ]; then
            echo "POLL_URL / POLL_SECRET not configured yet — skipping."
            exit 0
          fi
          curl -fsS -m 90 -X POST \
            -H "Authorization: Bearer $POLL_SECRET" \
            "$POLL_URL"
