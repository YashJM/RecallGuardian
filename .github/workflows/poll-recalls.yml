name: Poll recalls for new alerts

# Manual trigger for the push poller (Actions tab -> Run workflow).
# The every-5-minutes schedule lives in Supabase pg_cron (supabase/cron.sql);
# GitHub's free scheduler only managed ~4-5 runs/day, so it's no longer used.
on:
  workflow_dispatch: {}

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - name: Hit the poll endpoint
        env:
          POLL_URL: ${{ secrets.POLL_URL }}
          POLL_SECRET: ${{ secrets.POLL_SECRET }}
        run: |
          if [ -z "$POLL_URL" ] || [ -z "$POLL_SECRET" ]; then
            echo "POLL_URL / POLL_SECRET not configured yet — skipping."
            exit 0
          fi
          curl -fsS -m 90 -X POST \
            -H "Authorization: Bearer $POLL_SECRET" \
            "$POLL_URL"
